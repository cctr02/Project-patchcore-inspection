# ─── Study identity ───────────────────────────────────────────────────────────
study_name: ConvNeXtV2B_FCMAE_Pilot
results_root: results

# ─── Hardware / runtime ───────────────────────────────────────────────────────
gpu: 0                  # GPU index (-1 = CPU)
seed: 0
n_trials: 50
batch_size: 4
num_workers: 0          # set 0 on Windows if DataLoader hangs
faiss_on_gpu: false
faiss_num_workers: 4

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset: mvtec          # "mvtec" | "visa"
data_path: C:\Users\trloj\Code\mvtec_anomaly_detection
train_val_split: 1.0    # for VisA only (mvtec ignores it)

# ─── Backbone ─────────────────────────────────────────────────────────────────
backbone: convnextv2_base_fcmae
backbone_short: ConvNeXtV2B_FCMAE   # used in trial folder names

# ─── Search space ─────────────────────────────────────────────────────────────
# Supported types: categorical | float_log | float | int
#
# Special entries (not suggest_*):
#   resize          -> suggest_categorical over choices
#   imagesize_offset -> fixed: imagesize = resize - imagesize_offset
#   layer_combos    -> dict {key: [layers]}; key is suggest_categorical
search_space:

  resize:
    type: categorical
    choices: [256, 320, 384]

  imagesize_offset: 32    # imagesize = resize - 32

  layer_combos:
    L1-2: [stages.1, stages.2]
    L2-3: [stages.2, stages.3]

  pretrain_embed_dimension:
    type: categorical
    choices: [512, 768, 1024, 1536]

  target_embed_dimension:
    type: categorical
    choices: [512, 1024]

  patchsize:
    type: categorical
    choices: [1, 3, 5]

  coreset_fraction:   # fraction kept (0.1 = 10%); P{int*100} in trial name
    type: float_log
    low: 0.01
    high: 0.25

  anomaly_scorer_num_nn:
    type: categorical
    choices: [1, 3, 5]
