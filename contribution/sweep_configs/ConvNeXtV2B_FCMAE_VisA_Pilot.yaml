# ─── Study identity ───────────────────────────────────────────────────────────
study_name: ConvNeXtV2B_FCMAE_VisA_Pilot
results_root: results

# ─── Hardware / runtime ───────────────────────────────────────────────────────
gpu: 0
seed: 0
n_trials: 50
batch_size: 4
num_workers: 0
faiss_on_gpu: false
faiss_num_workers: 4

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset: visa
data_path: C:\Users\trloj\Code\VisA_20220922


# ─── Backbone ─────────────────────────────────────────────────────────────────
backbone: convnextv2_base_fcmae
backbone_short: ConvNeXtV2B_FCMAE

# ─── Search space ─────────────────────────────────────────────────────────────
search_space:

  resize:
    type: categorical
    choices: [256, 320, 384]

  imagesize_offset: 32

  layer_combos:
    L1-2: [stages.1, stages.2]
    L2-3: [stages.2, stages.3]

  pretrain_embed_dimension:
    type: categorical
    choices: [512, 768, 1024, 1536]

  target_embed_dimension:
    type: categorical
    choices: [512, 1024]

  patchsize:
    type: categorical
    choices: [1, 3, 5]

  coreset_fraction:   # fraction kept (0.1 = 10%); P{int*100} in trial name
    type: float_log
    low: 0.01
    high: 0.25

  anomaly_scorer_num_nn:
    type: categorical
    choices: [1, 3, 5]
