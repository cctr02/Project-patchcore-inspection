# ─── Study identity ───────────────────────────────────────────────────────────
study_name: DINOv2B_VisA_Pilot3
results_root: results

# ─── Hardware / runtime ───────────────────────────────────────────────────────
gpu: 0
seed: 0
n_trials: 50
batch_size: 4
num_workers: 0
faiss_on_gpu: false
faiss_num_workers: 4

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset: visa
data_path: C:\Users\trloj\Code\VisA_20220922

# ─── Backbone ─────────────────────────────────────────────────────────────────
# ViT-B/14 with register tokens — 768 channels, 12 blocks (0-11)
backbone: dinov2_vitb14_reg
backbone_short: DINOv2B14reg

# ─── Search space ─────────────────────────────────────────────────────────────
# DINOv2 notes:
#   - patch_size=14 → imagesize MUST be a multiple of 14
#   - Use resize_imagesize_pairs (not resize + imagesize_offset)
#   - patchsize=1 is standard (each token already covers 14×14 px)
#   - pretrain_embed_dimension should match or be a divisor of 768 (ViT-B)
search_space:

  resize_imagesize_pairs:
    - [512, 448]

  # Dynamic layer selection — TPE assigns a continuous score to each candidate
  # block; high-scoring blocks appear more often in future trials.
  # If block 11 always boosts AUROC, TPE raises block_score_11 automatically.
  layer_sampling:
    candidates: [3, 4, 5, 7, 8]   
    n_layers: [1, 2, 3]                             

  pretrain_embed_dimension:
    type: categorical
    choices: [768]           

  target_embed_dimension:
    type: categorical
    choices: [768]

  patchsize:
    type: categorical
    choices: [1]     

  coreset_fraction:   # fraction kept (0.1 = 10%); P{int*100} in trial name
    type: categorical
    choices: [0.1]  

  anomaly_scorer_num_nn:
    type: categorical
    choices: [3]
