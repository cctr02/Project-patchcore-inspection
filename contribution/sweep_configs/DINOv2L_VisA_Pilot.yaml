# ─── Study identity ───────────────────────────────────────────────────────────
study_name: DINOv2L_VisA_Pilot
results_root: results

# ─── Hardware / runtime ───────────────────────────────────────────────────────
gpu: 0
seed: 0
n_trials: 50
batch_size: 2           # ViT-L is larger; reduce batch if OOM
num_workers: 0
faiss_on_gpu: false
faiss_num_workers: 4

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset: visa
data_path: C:\Users\trloj\Code\VisA_20220922
train_val_split: 1.0

pilot_classes:
  - candle
  - cashew
  - capsules
  - pcb1

# ─── Backbone ─────────────────────────────────────────────────────────────────
# ViT-L/14 with register tokens — 1024 channels, 24 blocks (0-23)
backbone: dinov2_vitl14_reg
backbone_short: DINOv2L14reg

# ─── Search space ─────────────────────────────────────────────────────────────
search_space:

  # Pairs (resize, imagesize): imagesize ∈ {336=24×14, 448=32×14}
  # Skipping 224 for ViT-L: too few tokens (16×16=256) loses localization quality
  resize_imagesize_pairs:
    - [512, 448]

  layer_combos:
    L11-23: [blocks.11, blocks.23]   
    L7-23:  [blocks.7,  blocks.23]   
    L7-14-23:  [blocks.7, blocks.14, blocks.23]   

  pretrain_embed_dimension:
    type: categorical
    choices: [1024]            

  target_embed_dimension:
    type: categorical
    choices: [512, 1024]

  patchsize:
    type: categorical
    choices: [1, 3]

  coreset_pct:
    type: float_log
    low: 0.01
    high: 0.15                      # smaller range: ViT-L coreset is larger

  anomaly_scorer_num_nn:
    type: categorical
    choices: [1, 3, 5]
