# ─── Study identity ───────────────────────────────────────────────────────────
study_name: WR50_Pilot
results_root: results

# ─── Hardware / runtime ───────────────────────────────────────────────────────
gpu: 0
seed: 0
n_trials: 50
batch_size: 4
num_workers: 0
faiss_on_gpu: false
faiss_num_workers: 4

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset: mvtec
data_path: C:\Users\trloj\Code\mvtec_anomaly_detection
train_val_split: 1.0

pilot_classes:
  - capsule
  - carpet
  - grid
  - screw

# ─── Backbone ─────────────────────────────────────────────────────────────────
backbone: wideresnet50
backbone_short: WR50

# ─── Search space ─────────────────────────────────────────────────────────────
search_space:

  resize:
    type: categorical
    choices: [256, 320]

  imagesize_offset: 32    # imagesize = resize - 32

  layer_combos:
    L2-3: [layer2, layer3]
    L1-2: [layer1, layer2]

  pretrain_embed_dimension:
    type: categorical
    choices: [512, 1024, 1536]

  target_embed_dimension:
    type: categorical
    choices: [512, 1024]

  patchsize:
    type: categorical
    choices: [3, 5]

  coreset_pct:
    type: float_log
    low: 0.01
    high: 0.25

  anomaly_scorer_num_nn:
    type: categorical
    choices: [1, 3, 5]
